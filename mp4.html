<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friestv</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
body {
  background: #141414;
  color: #fff;
}

/* Top Navbar */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 999;
  display: flex;
  align-items: center;
  padding: 15px 4%;
  background: linear-gradient(to bottom, rgba(0,0,0,.8), transparent);
}
nav .logo {
  color:#e24000;;
  font-size: 22px;
  font-weight: 900;
  margin-right: 35px;
}
nav a {
  color: #e5e5e5;
  text-decoration: none;
  margin-right: 22px;
  font-size: 15px;
}
nav a:hover { color: #fff; }
.nav-right {
  margin-left: auto;
  display: flex;
  gap: 22px;
  font-size: 19px;
  cursor: pointer;
}

/* Featured Hero - matches your screenshot */
.featured {
  width: 100%;
  min-height: 100vh;
  background: linear-gradient(rgba(0,0,0,.3), #141414), #0914e5;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 4%;
}
.featured h1 {
  font-size: clamp(2.5rem, 7vw, 4.5rem);
  max-width: 750px;
  margin-bottom: 28px;
  line-height: 1.1;
}
.btn {
  padding: 13px 35px;
  font-size: 18px;
  font-weight: 700;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  margin-right: 15px;
  transition: .2s ease;
}
.btn-play { background: #fff; color: #000; }
.btn-play:hover { background: #ff0808e0; }
.btn-info { background: rgba(228, 0, 0, 0.877); color: #fff; }
.btn-info:hover { background: rgba(109,109,110,.4); }

/* Movie Rows */
.movie-section {
  position: relative;
  z-index: 2;
  padding: 30px 4% 50px;
}
.movie-section h2 {
  margin-bottom: 12px;
  font-size: 21px;
}
.row-wrapper { position: relative; }
.movie-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 2px 15px;
  scroll-behavior: smooth;
}
.movie-row::-webkit-scrollbar { display: none; }
.movie-card {
  min-width: 210px;
  border-radius: 4px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .25s ease;
  position: relative;
}
.movie-card:hover { transform: scale(1.08); z-index: 10; }
.movie-card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  display: block;
}
.scroll-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  height: 75%;
  width: 50px;
  background: rgba(20,20,20,.8);
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  z-index: 15;
}
.scroll-btn.left { left: -22px; }
.scroll-btn.right { right: -22px; }
.scroll-btn:hover { background: rgba(20,20,20,1); }

/* Full Video Player Overlay */
#videoPlayerOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 9999;
  flex-direction: column;
}
#videoPlayerOverlay.active { display: flex; }
.close-player {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 35px;
  color: #fff;
  cursor: pointer;
  z-index: 10000;
}
#mainVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

/* Bottom Nav — */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:58px;
  background:#000;
  border-top:1px solid #222;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:99;
}
.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  cursor:pointer;
  color:#e87909;
  transition:color 0.1s;
}
.nav-item.active{color:#ff7700;}
.nav-icon{font-size:22px;}
.nav-text{font-size:10px;}
</style>
</head>
<body>

<!-- Navigation -->
<nav>
  <div class="logo">FriesTV</div>
  <a href="myfries.html">Home</a>
  <a href="tv.html">TV Shows</a>
  <a href="movies.html">Movies</a>
  <a href="mp4.html">Music</a>
  <a href="geez.html">Geez</a>
  <div class="nav-right">
    <span>🔍</span>
  </div>
</nav>

<!-- Featured Banner -->
<div class="featured">
  <h1>Watch Something Incredible</h1>
  <div style="margin-top:10px">
    <button class="btn btn-play" onclick="openVideo('movie1.mp4')">▶ Play</button>
    
  </div>
</div>

<!-- Movie Rows -->
<div class="movie-section">
  <h2>Trending Now</h2>
  <div class="row-wrapper">
    <button class="scroll-btn left" onclick="slideRow('row1', -1000)">‹</button>
    <div class="movie-row" id="row1">
      <div class="movie-card" onclick="openVideo('movie1.mp4')"><img src="https://picsum.photos/id/237/420/240"></div>
      <div class="movie-card" onclick="openVideo('movie2.mp4')"><img src="https://picsum.photos/id/1015/420/240"></div>
      <div class="movie-card" onclick="openVideo('movie3.mp4')"><img src="https://picsum.photos/id/1016/420/240"></div>
      <div class="movie-card" onclick="openVideo('movie4.mp4')"><img src="https://picsum.photos/id/1018/420/240"></div>
      <div class="movie-card" onclick="openVideo('movie5.mp4')"><img src="https://picsum.photos/id/1019/420/240"></div>
      <div class="movie-card" onclick="openVideo('movie6.mp4')"><img src="https://picsum.photos/id/1035/420/240"></div>
    </div>
    <button class="scroll-btn right" onclick="slideRow('row1', 1000)">›</button>
  </div>
</div>

<div class="movie-section">
  <h2>Top Picks</h2>
  <div class="row-wrapper">
    <button class="scroll-btn left" onclick="slideRow('row2', -1000)">‹</button>
    <div class="movie-row" id="row2">
      <div class="movie-card" onclick="openVideo('movie7.mp4')"><img src="https://picsum.photos/id/1043/420/240"></div>
      <div class="movie-card" onclick="openVideo('movie8.mp4')"><img src="https://picsum.photos/id/1047/420/240"></div>
      <div class="movie-card" onclick="openVideo('movie9.mp4')"><img src="https://picsum.photos/id/1059/420/240"></div>
      <div class="movie-card" onclick="openVideo('movie10.mp4')"><img src="https://picsum.photos/id/1069/420/240"></div>
    </div>
    <button class="scroll-btn right" onclick="slideRow('row2', 1000)">›</button>
  </div>
</div>

<!-- Fullscreen Video Player -->
<div id="videoPlayerOverlay">
  <span class="close-player" onclick="closeVideo()">×</span>
  <video id="mainVideo" controls autoplay playsinline></video>
</div>
<br>
<!-- Bottom Nav -->
<div class="bottom-nav">
  <div class="nav-item" onclick="location.href='myfries.html'">
    <span class="nav-icon">🏠</span>
    <span class="nav-text">Home</span>
  </div>
   <div class="nav-item" onclick="location.href='tv.html'">
    <span class="nav-icon">🎞️</span>
    <span class="nav-text">TV/Show</span>
  </div>
   <div class="nav-item" onclick="location.href='geez.html'">
    <span class="nav-icon">🏠</span>
    <span class="nav-text">Geez</span>
  </div>
  <div class="nav-item" onclick="location.href='movies.html'">
    <span class="nav-icon">🎞️</span>
    <span class="nav-text">Movies</span>
  </div>
   <div class="nav-item" onclick="location.href='mp4.html'">
    <span class="nav-icon">🎞️</span>
    <span class="nav-text">Music</span>
  </div>
</div>
<script>
// Slide movie rows
function slideRow(id, move) {
  const row = document.getElementById(id);
  row.scrollLeft += move;
}

// Open full video player
const overlay = document.getElementById('videoPlayerOverlay');
const video = document.getElementById('mainVideo');

function openVideo(src) {
  video.src = src;
  overlay.classList.add('active');
  video.play();
  document.body.style.overflow = 'hidden';
}

// Close player
function closeVideo() {
  video.pause();
  video.src = '';
  overlay.classList.remove('active');
  document.body.style.overflow = 'auto';
}

// Close with Escape key
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeVideo();
});
</script>
</body>
</html>
